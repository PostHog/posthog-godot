name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Immutable source commit to verify'
        type: string
        required: false
        default: ''
      candidate-patch-sha256:
        description: 'Checksum of the release-candidate patch, empty for normal CI'
        type: string
        required: false
        default: ''
      candidate-tree-sha:
        type: string
        required: false
        default: ''
      candidate-version:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            godot: '4.5'
          - os: windows-latest
            godot: '4.5'
          - os: macos-latest
            godot: '4.5.1'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.candidate-patch-sha256 != ''
        with:
          name: release-candidate-${{ inputs.ref }}
          path: dist/release-candidate
      - name: Apply and validate release candidate
        if: inputs.candidate-patch-sha256 != ''
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.ref }}
          PATCH_SHA256: ${{ inputs.candidate-patch-sha256 }}
          TREE_SHA: ${{ inputs.candidate-tree-sha }}
          VERSION: ${{ inputs.candidate-version }}
        run: |
          python scripts/release_candidate.py dist/release-candidate/release.patch \
            --source "$SOURCE_SHA" --sha256 "$PATCH_SHA256" --tree "$TREE_SHA" --version "$VERSION"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/godot
          key: godot-${{ matrix.godot }}-export-tests-${{ runner.os }}-v1
      - name: Install pinned Godot and export templates
        run: python scripts/install_godot.py --version "${{ matrix.godot }}-stable" --templates
        timeout-minutes: 10
      - name: Install development tools
        run: python -m pip install gdtoolkit==4.5.0 ruff==0.12.11
      - name: Lint and format
        run: |
          gdformat --check addons tests examples
          gdlint addons tests examples
          ruff check scripts
          ruff format --check scripts
      - name: Headless unit, HTTP, editor, and packaging tests
        run: python scripts/test.py
      - name: Installer and release tooling tests (no publishing)
        run: |
          python scripts/test_install_godot.py
          python -m unittest discover -s scripts -p 'test_release*.py'
      - name: Real desktop release exports and stacktrace tests
        run: python scripts/test_exports.py
      - name: Example smoke test (no API key)
        shell: bash
        run: '"$GODOT" --headless --path . --quit-after 3'
      - name: Check tested candidate is unchanged
        if: inputs.candidate-patch-sha256 != ''
        shell: bash
        env:
          TREE_SHA: ${{ inputs.candidate-tree-sha }}
        run: |
          git diff --exit-code
          test "$(git write-tree)" = "$TREE_SHA"
      - name: Package addon
        if: runner.os == 'Linux'
        run: python scripts/package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: posthog-godot
          path: dist/posthog-godot-*.zip
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.candidate-patch-sha256 != ''
        with:
          name: release-candidate-${{ inputs.ref }}
          path: dist/release-candidate
      - name: Apply and validate release candidate
        if: inputs.candidate-patch-sha256 != ''
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.ref }}
          PATCH_SHA256: ${{ inputs.candidate-patch-sha256 }}
          TREE_SHA: ${{ inputs.candidate-tree-sha }}
          VERSION: ${{ inputs.candidate-version }}
        run: |
          python scripts/release_candidate.py dist/release-candidate/release.patch \
            --source "$SOURCE_SHA" --sha256 "$PATCH_SHA256" --tree "$TREE_SHA" --version "$VERSION"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/godot
          key: godot-4.5-export-tests-${{ runner.os }}-v1
      - name: Install pinned Godot and export templates
        run: python scripts/install_godot.py --templates
        timeout-minutes: 10
      - name: Build Web release exports
        run: python scripts/test_exports.py --target web
      - name: Install browser test dependencies
        working-directory: tests/web
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps --only-shell chromium
        timeout-minutes: 5
      - name: Test browser persistence, consent, CORS, and release stacktraces
        working-directory: tests/web
        run: npm test
      - name: Check tested candidate is unchanged
        if: inputs.candidate-patch-sha256 != ''
        shell: bash
        env:
          TREE_SHA: ${{ inputs.candidate-tree-sha }}
        run: |
          git diff --exit-code
          test "$(git write-tree)" = "$TREE_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-export-test-results
          path: |
            tests/web/playwright-report/
            tests/web/test-results/
          if-no-files-found: warn
