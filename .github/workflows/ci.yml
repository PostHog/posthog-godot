name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Immutable source commit to verify and package for a release'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            godot: '4.5'
          - os: windows-latest
            godot: '4.5'
          - os: macos-latest
            godot: '4.5.1'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/godot
          key: godot-${{ matrix.godot }}-export-tests-${{ runner.os }}-v1
      - name: Install pinned Godot and export templates
        run: python scripts/install_godot.py --version "${{ matrix.godot }}-stable" --templates
        timeout-minutes: 10
      - name: Install development tools
        run: python -m pip install gdtoolkit==4.5.0 ruff==0.12.11
      - name: Lint and format
        run: |
          gdformat --check addons tests examples
          gdlint addons tests examples
          ruff check scripts
          ruff format --check scripts
      - name: Headless unit, HTTP, editor, and packaging tests
        run: python scripts/test.py
      - name: Installer and release tooling tests (no publishing)
        run: |
          python scripts/test_install_godot.py
          python scripts/test_release.py
      - name: Real desktop release exports and stacktrace tests
        run: python scripts/test_exports.py
      - name: Example smoke test (no API key)
        shell: bash
        run: '"$GODOT" --headless --path . --quit-after 3'
      - name: Package addon
        if: runner.os == 'Linux'
        run: python scripts/package.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux'
        with:
          name: posthog-godot
          path: dist/posthog-godot-*.zip
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/godot
          key: godot-4.5-export-tests-${{ runner.os }}-v1
      - name: Install pinned Godot and export templates
        run: python scripts/install_godot.py --templates
        timeout-minutes: 10
      - name: Build Web release exports
        run: python scripts/test_exports.py --target web
      - name: Install browser test dependencies
        working-directory: tests/web
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps --only-shell chromium
        timeout-minutes: 5
      - name: Test browser persistence, consent, CORS, and release stacktraces
        working-directory: tests/web
        run: npm test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-export-test-results
          path: |
            tests/web/playwright-report/
            tests/web/test-results/
          if-no-files-found: warn
