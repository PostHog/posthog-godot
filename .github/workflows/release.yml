name: Release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version without a v prefix, e.g. 0.1.0 (dry run; does not create a tag or release)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate tag against all SDK version declarations
        run: python scripts/release.py "$TAG" --check

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: posthog-godot
          path: dist
      - name: Validate tested archive and prepare checksums and submission worksheet
        run: python scripts/release.py "$TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/posthog-godot-*.zip
            dist/SHA256SUMS
            dist/asset-library.json
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.repository == 'PostHog/posthog-godot'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Verify immutable source and publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          source_sha=$(jq -r '.source_commit' asset-library.json)
          tag_sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq '.sha')
          test "$source_sha" = "$tag_sha"
          gh release create "$TAG" "posthog-godot-${TAG}.zip" SHA256SUMS asset-library.json \
            --verify-tag --prerelease --latest=false \
            --title "PostHog Godot $TAG (Experimental)" --generate-notes \
            --notes "Experimental Godot 4.5+ SDK. Install the posthog-godot ZIP below, not the automatic source archives. See the packaged documentation for limitations. Asset Library submission is a separate manual step."
