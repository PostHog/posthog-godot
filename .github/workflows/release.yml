name: Release

on:
  push:
    branches: [main]
    paths: ['.changeset/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare-candidate:
    name: Prepare release candidate
    if: github.repository == 'PostHog/posthog-godot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      source-sha: ${{ steps.plan.outputs.source-sha }}
      tree-sha: ${{ steps.plan.outputs.tree-sha }}
      patch-sha256: ${{ steps.plan.outputs.patch-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Queued runs consume the intents still pending on main, not a stale push.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          version: 11.13.1
          runtime: node@24
          install: false
      - name: Apply pending change intents without committing
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          old_version=$(python -c 'import json; print(json.load(open("package.json"))["version"])')
          pnpm version -r
          new_version=$(python -c 'import json; print(json.load(open("package.json"))["version"])')
          if [ "$old_version" = "$new_version" ]; then
            echo "No pending releasable change intents"
            exit 0
          fi
          python scripts/bump_version.py
          python scripts/release.py "$new_version" --check
          git add CHANGELOG.md package.json .changeset addons/posthog/plugin.cfg addons/posthog/internal/utils.gd project.godot
          mkdir -p dist/release-candidate
          git diff --cached --binary > dist/release-candidate/release.patch
          source_sha=$(git rev-parse HEAD)
          tree_sha=$(git write-tree)
          patch_sha256=$(sha256sum dist/release-candidate/release.patch | awk '{print $1}')
          {
            echo "version=$new_version"
            echo "source-sha=$source_sha"
            echo "tree-sha=$tree_sha"
            echo "patch-sha256=$patch_sha256"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release candidate $new_version"
            echo "Source commit: $source_sha"
            echo "Candidate tree: $tree_sha"
            echo "Patch SHA-256: $patch_sha256"
            echo "Review the release-candidate artifact before approving publication. No commit has been made."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.plan.outputs.version != ''
        with:
          name: release-candidate-${{ steps.plan.outputs.source-sha }}
          path: dist/release-candidate/release.patch
          if-no-files-found: error
          retention-days: 5
          overwrite: true

  verify:
    needs: prepare-candidate
    if: needs.prepare-candidate.outputs.version != ''
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare-candidate.outputs.source-sha }}
      candidate-patch-sha256: ${{ needs.prepare-candidate.outputs.patch-sha256 }}
      candidate-tree-sha: ${{ needs.prepare-candidate.outputs.tree-sha }}
      candidate-version: ${{ needs.prepare-candidate.outputs.version }}

  notify-approval-needed:
    name: Notify Slack - Approval Needed
    needs: verify
    uses: posthog/.github/.github/workflows/notify-approval-needed.yml@5ba5d24966f2c416ca792654638e4ce6f19f545b # main
    with:
      slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
      slack_user_group_id: ${{ vars.GROUP_CLIENT_LIBRARIES_SLACK_GROUP_ID }}
      checkout_repository: false
      tag_pattern: '[0-9]*'
      tag_sort: version
    secrets:
      slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
      posthog_project_api_key: ${{ secrets.POSTHOG_PROJECT_API_KEY }}

  publish:
    name: Commit and publish approved release
    needs: [prepare-candidate, verify, notify-approval-needed]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Release
    steps:
      - name: Notify Slack - Approved
        if: needs.notify-approval-needed.outputs.slack_ts != ''
        uses: posthog/.github/.github/actions/slack-thread-reply@cb0979b67dcd585828b61ac45927eef4da8f6287 # main
        with:
          slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
          slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
          thread_ts: ${{ needs.notify-approval-needed.outputs.slack_ts }}
          message: "✅ Release approved! Publishing release..."
          emoji_reaction: "white_check_mark"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-candidate.outputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ needs.prepare-candidate.outputs.source-sha }}
          path: dist/release-candidate
      - name: Apply the verified candidate
        env:
          SOURCE_SHA: ${{ needs.prepare-candidate.outputs.source-sha }}
          PATCH_SHA256: ${{ needs.prepare-candidate.outputs.patch-sha256 }}
          TREE_SHA: ${{ needs.prepare-candidate.outputs.tree-sha }}
          VERSION: ${{ needs.prepare-candidate.outputs.version }}
        run: |
          python scripts/release_candidate.py dist/release-candidate/release.patch \
            --source "$SOURCE_SHA" --sha256 "$PATCH_SHA256" --tree "$TREE_SHA" --version "$VERSION"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: releaser
        with:
          client-id: ${{ secrets.GH_APP_POSTHOG_GODOT_RELEASER_APP_ID }}
          private-key: ${{ secrets.GH_APP_POSTHOG_GODOT_RELEASER_PRIVATE_KEY }}
          permission-contents: write
      - name: Create signed version commit without overwriting concurrent changes
        id: commit
        env:
          GH_TOKEN: ${{ steps.releaser.outputs.token }}
          GH_REPO: ${{ github.repository }}
          NEW_VERSION: ${{ needs.prepare-candidate.outputs.version }}
          EXPECTED_TREE_SHA: ${{ needs.prepare-candidate.outputs.tree-sha }}
        run: python scripts/commit_release.py
      - name: Check out the signed commit and verify its tested tree
        env:
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
          TREE_SHA: ${{ needs.prepare-candidate.outputs.tree-sha }}
          VERSION: ${{ needs.prepare-candidate.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$RELEASE_SHA"
          git checkout --detach "$RELEASE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TREE_SHA"
          git diff --exit-code
          python scripts/release.py "$VERSION" --check
      - name: Build and validate final assets with commit-pinned documentation
        env:
          VERSION: ${{ needs.prepare-candidate.outputs.version }}
        run: |
          python -m unittest discover -s scripts -p 'test_release*.py'
          python scripts/package.py
          python scripts/release.py "$VERSION"
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/posthog-godot-*.zip
            dist/SHA256SUMS
            dist/asset-library.json
          if-no-files-found: error
          overwrite: true
      - name: Verify immutable source and publish experimental prerelease
        env:
          GH_TOKEN: ${{ steps.releaser.outputs.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare-candidate.outputs.version }}
          SOURCE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          test "$(jq -r '.source_commit' asset-library.json)" = "$SOURCE_SHA"
          test "$(jq -r '.version' asset-library.json)" = "$VERSION"
          tag_ref="refs/tags/$VERSION"
          existing=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$VERSION" --jq ".[] | select(.ref == \"$tag_ref\") | .ref")
          if [ -n "$existing" ]; then
            test "$(gh api "repos/$GH_REPO/commits/$VERSION" --jq '.sha')" = "$SOURCE_SHA"
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="$tag_ref" -f sha="$SOURCE_SHA"
          fi
          gh release create "$VERSION" "posthog-godot-${VERSION}.zip" SHA256SUMS asset-library.json \
            --repo "$GH_REPO" --verify-tag --prerelease --latest=false \
            --title "PostHog Godot $VERSION (Experimental)" --generate-notes \
            --notes "Experimental Godot 4.5+ SDK. Install the posthog-godot ZIP below, not the automatic source archives. See the packaged documentation for limitations. Asset Library submission is a separate manual step."

  notify-result:
    name: Notify Slack/PostHog - Release Result
    needs: [prepare-candidate, verify, notify-approval-needed, publish]
    if: always() && (failure() || cancelled() || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check whether release was rejected
        id: check-failure
        if: needs.notify-approval-needed.outputs.slack_ts != '' && (needs.publish.result == 'failure' || needs.publish.result == 'cancelled')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          rejected=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/approvals" --jq 'any(.[]; .state == "rejected")')
          echo "was_rejected=$rejected" >> "$GITHUB_OUTPUT"
      - name: Send failure event to PostHog
        if: steps.check-failure.outputs.was_rejected != 'true' && (failure() || needs.prepare-candidate.result == 'failure' || needs.verify.result == 'failure' || needs.publish.result == 'failure')
        continue-on-error: true
        uses: PostHog/posthog-github-action@9a6a19d360820ab4d95ecc4a5a7564062c895f84 # v1.3.0
        with:
          posthog-token: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
          event: posthog-sdk-github-release-workflow-failure
          properties: >-
            {
              "repository": "${{ github.repository }}",
              "sdk": "posthog-godot",
              "packageName": "posthog-godot",
              "packageVersion": "${{ needs.prepare-candidate.outputs.version || 'unknown' }}",
              "actionUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "alertText": "posthog-godot release failed"
            }
      - name: Notify Slack - Released
        if: always() && needs.publish.result == 'success' && needs.notify-approval-needed.outputs.slack_ts != ''
        uses: posthog/.github/.github/actions/slack-thread-reply@cb0979b67dcd585828b61ac45927eef4da8f6287 # main
        with:
          slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
          slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
          thread_ts: ${{ needs.notify-approval-needed.outputs.slack_ts }}
          message: "🚀 posthog-godot@${{ needs.prepare-candidate.outputs.version }} released successfully! <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
          emoji_reaction: "rocket"
      - name: Notify Slack - Failed
        if: always() && needs.publish.result != 'success' && steps.check-failure.outputs.was_rejected != 'true' && needs.notify-approval-needed.outputs.slack_ts != ''
        uses: posthog/.github/.github/actions/slack-thread-reply@cb0979b67dcd585828b61ac45927eef4da8f6287 # main
        with:
          slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
          slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
          thread_ts: ${{ needs.notify-approval-needed.outputs.slack_ts }}
          message: "❌ Release posthog-godot@${{ needs.prepare-candidate.outputs.version }} failed or was cancelled! <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
          emoji_reaction: "x"
      - name: Notify Slack - Rejected
        if: always() && steps.check-failure.outputs.was_rejected == 'true' && needs.notify-approval-needed.outputs.slack_ts != ''
        continue-on-error: true
        uses: posthog/.github/.github/actions/slack-thread-reply@cb0979b67dcd585828b61ac45927eef4da8f6287 # main
        with:
          slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
          slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
          thread_ts: ${{ needs.notify-approval-needed.outputs.slack_ts }}
          message: "🚫 Release posthog-godot@${{ needs.prepare-candidate.outputs.version }} was rejected. <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
          emoji_reaction: "no_entry_sign"
