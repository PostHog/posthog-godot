name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to validate in a dry run (does not create a tag or release)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate tag against all SDK version declarations
        run: python scripts/release.py "$TAG" --check

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: posthog-godot
          path: dist
      - name: Validate tested archive and prepare checksums and submission worksheet
        run: python scripts/release.py "$TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            dist/posthog-godot-*.zip
            dist/SHA256SUMS
            dist/asset-library.json
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.repository == 'PostHog/posthog-godot'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Verify immutable source and publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          source_sha=$(jq -r '.source_commit' asset-library.json)
          tag_sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq '.sha')
          test "$source_sha" = "$tag_sha"
          gh release create "$TAG" "posthog-godot-${TAG#v}.zip" SHA256SUMS asset-library.json \
            --verify-tag --prerelease --latest=false \
            --title "PostHog Godot $TAG (Experimental)" --generate-notes \
            --notes "Experimental Godot 4.5+ SDK. Install the posthog-godot ZIP below, not the automatic source archives. See the packaged documentation for limitations. Asset Library submission is a separate manual step."
