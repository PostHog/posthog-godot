name: Feature Request
description: Suggest a problem this SDK could solve.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem would you like the SDK to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe any ideas or alternatives you have considered.
    validations:
      required: false
