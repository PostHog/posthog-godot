name: Bug Report
description: Report something that is not working as expected.
labels: ["bug"]
body:
  - type: input
    id: sdk_version
    attributes:
      label: SDK version
      placeholder: 0.1.2
    validations:
      required: true
  - type: input
    id: godot_version
    attributes:
      label: Godot version
      placeholder: 4.5.1.stable
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and build type
      description: Include the OS or browser version and whether this happens in editor play, a debug export, or a release export.
      placeholder: Windows 11, release export
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include a minimal reproduction project or code sample if possible. Remove API keys and personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include relevant logs or screenshots with API keys and personal data removed.
    validations:
      required: true
