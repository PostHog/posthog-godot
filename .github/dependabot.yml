version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/tests/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      browser-test-dependencies:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
